<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800">
  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" fill="#A351D4" font-size="16" font-weight="bold">Complete PKV Example: Twitter Profile</text>

  <!-- Step 1: Input Data -->
  <g transform="translate(200,70)">
    <rect x="0" y="0" width="300" height="60" rx="5" fill="#A351D4" opacity="0.05" stroke="#A351D4" stroke-width="2"/>
    <text x="150" y="20" text-anchor="middle" fill="#A351D4" font-size="11" font-weight="bold">Input Data</text>
    <text x="150" y="38" text-anchor="middle" fill="#A351D4" font-size="10">Key: ["twitter.com", "@mikeal", "fullname"]</text>
    <text x="150" y="53" text-anchor="middle" fill="#A351D4" font-size="10">Value: "Mikeal Rogers"</text>
  </g>

  <!-- Step 2: PKV-KEY Creation -->
  <g transform="translate(250,160)">
    <path d="M 100 -30 L 100 0" stroke="#A351D4" stroke-width="1.5" marker-end="url(#arrowhead-cyan-ex)"/>

    <rect x="0" y="0" width="200" height="50" rx="5" fill="#A351D4" opacity="0.1" stroke="#A351D4" stroke-width="2"/>
    <text x="100" y="15" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">1. Create PKV-KEY</text>
    <text x="100" y="28" text-anchor="middle" fill="#A351D4" font-size="9">H(H("twitter.com")) +</text>
    <text x="100" y="41" text-anchor="middle" fill="#A351D4" font-size="9">H(...+"@mikeal") + H(...+"fullname")</text>

    <rect x="30" y="60" width="140" height="20" rx="3" fill="none" stroke="#A351D4" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="100" y="74" text-anchor="middle" fill="#A351D4" font-size="8" font-family="monospace">PKV-KEY: 0xC4D2...</text>
  </g>

  <!-- Step 3: PKV-VALUE Creation -->
  <g transform="translate(250,270)">
    <path d="M 100 -30 L 100 0" stroke="#A351D4" stroke-width="1.5" marker-end="url(#arrowhead-cyan-ex)"/>

    <rect x="0" y="0" width="200" height="50" rx="5" fill="#A351D4" opacity="0.1" stroke="#A351D4" stroke-width="2"/>
    <text x="100" y="15" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">2. Create PKV-VALUE</text>
    <text x="100" y="28" text-anchor="middle" fill="#A351D4" font-size="9">H("Mikeal Rogers")</text>
    <text x="100" y="41" text-anchor="middle" fill="#A351D4" font-size="9">+ PKV-KEY → H(combined)</text>

    <rect x="30" y="60" width="140" height="20" rx="3" fill="none" stroke="#A351D4" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="100" y="74" text-anchor="middle" fill="#A351D4" font-size="8" font-family="monospace">PKV-VALUE: 0x9A8E...</text>
  </g>

  <!-- Step 4: PKV-KV Creation -->
  <g transform="translate(250,380)">
    <path d="M 100 -30 L 100 0" stroke="#A351D4" stroke-width="1.5" marker-end="url(#arrowhead-cyan-ex)"/>

    <rect x="0" y="0" width="200" height="40" rx="5" fill="#A351D4" opacity="0.1" stroke="#A351D4" stroke-width="2"/>
    <text x="100" y="15" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">3. Create PKV-KV</text>
    <text x="100" y="30" text-anchor="middle" fill="#A351D4" font-size="9">Combine PKV-KEY + PKV-VALUE</text>

    <rect x="30" y="50" width="140" height="20" rx="3" fill="none" stroke="#A351D4" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="100" y="64" text-anchor="middle" fill="#A351D4" font-size="8" font-family="monospace">PKV-KV: 0x5E7C...</text>
  </g>

  <!-- Step 5: Time-Space Data -->
  <g transform="translate(250,480)">
    <path d="M 100 -30 L 100 0" stroke="#A351D4" stroke-width="1.5" marker-end="url(#arrowhead-cyan-ex)"/>

    <rect x="0" y="0" width="200" height="40" rx="5" fill="#A351D4" opacity="0.15" stroke="#A351D4" stroke-width="2"/>
    <text x="100" y="15" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">4. Add Time-Space</text>
    <text x="100" y="30" text-anchor="middle" fill="#A351D4" font-size="9">🕐 2024-01-15 🌍 us-east-1</text>
  </g>

  <!-- Step 6: Sign Everything -->
  <g transform="translate(250,550)">
    <path d="M 100 -30 L 100 0" stroke="#A351D4" stroke-width="1.5" marker-end="url(#arrowhead-cyan-ex)"/>

    <rect x="0" y="0" width="200" height="50" rx="5" fill="#A351D4" opacity="0.2" stroke="#A351D4" stroke-width="2"/>
    <text x="100" y="15" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">5. Sign with Private Key 🔒</text>
    <text x="100" y="30" text-anchor="middle" fill="#A351D4" font-size="9">Sign(H(time-space) + PKV-KV)</text>
    <text x="100" y="43" text-anchor="middle" fill="#A351D4" font-size="8" font-family="monospace">Signature: 0x3A9F...</text>
  </g>

  <!-- Final Result -->
  <g transform="translate(200,630)">
    <rect x="0" y="0" width="300" height="80" rx="5" fill="#A351D4" opacity="0.25" stroke="#A351D4" stroke-width="3"/>
    <text x="150" y="20" text-anchor="middle" fill="#A351D4" font-size="11" font-weight="bold">Final PKV Package</text>
    <text x="150" y="38" text-anchor="middle" fill="#A351D4" font-size="9">✅ Cryptographically signed</text>
    <text x="150" y="53" text-anchor="middle" fill="#A351D4" font-size="9">✅ Time/space bound</text>
    <text x="150" y="68" text-anchor="middle" fill="#A351D4" font-size="9">✅ Independently verifiable</text>
  </g>

  <!-- Verification -->
  <g transform="translate(150,730)">
    <rect x="0" y="0" width="400" height="50" rx="5" fill="none" stroke="#A351D4" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="200" y="20" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">Anyone Can Verify:</text>
    <text x="200" y="35" text-anchor="middle" fill="#A351D4" font-size="9">Public key 🔓 validates signature → Confirms: @mikeal's fullname = "Mikeal Rogers"</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead-cyan-ex" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#A351D4"/>
    </marker>
  </defs>
</svg>