<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#A351D4" font-size="16" font-weight="bold">npm dependedUpon View - Range Queries</text>

  <!-- Root node with range boundaries -->
  <g transform="translate(250,70)">
    <rect x="0" y="0" width="100" height="40" fill="none" stroke="#A351D4" stroke-width="2"/>
    <text x="50" y="18" text-anchor="middle" fill="#A351D4" font-size="9">["async"...</text>
    <text x="50" y="30" text-anchor="middle" fill="#A351D4" font-size="9">..."axios"]</text>

    <rect x="100" y="0" width="100" height="40" fill="none" stroke="#A351D4" stroke-width="2"/>
    <text x="150" y="18" text-anchor="middle" fill="#A351D4" font-size="9">["express"...</text>
    <text x="150" y="30" text-anchor="middle" fill="#A351D4" font-size="9">..."express", {}]</text>

    <rect x="200" y="0" width="100" height="40" fill="none" stroke="#A351D4" stroke-width="2"/>
    <text x="250" y="18" text-anchor="middle" fill="#A351D4" font-size="9">["lodash"...</text>
    <text x="250" y="30" text-anchor="middle" fill="#A351D4" font-size="9">..."lodash", {}]</text>

    <rect x="300" y="0" width="100" height="40" fill="none" stroke="#A351D4" stroke-width="2"/>
    <text x="350" y="18" text-anchor="middle" fill="#A351D4" font-size="9">["react"...</text>
    <text x="350" y="30" text-anchor="middle" fill="#A351D4" font-size="9">..."webpack", {}]</text>
  </g>

  <!-- Leaf nodes with data and value counts -->
  <!-- First leaf -->
  <g transform="translate(50,200)">
    <rect x="0" y="0" width="120" height="30" fill="none" stroke="#A351D4" stroke-width="2"/>
    <text x="60" y="20" text-anchor="middle" fill="#A351D4" font-size="9">["async", "npm-test",...</text>

    <rect x="0" y="30" width="120" height="30" fill="none" stroke="#A351D4" stroke-width="2"/>
    <text x="60" y="50" text-anchor="middle" fill="#A351D4" font-size="9">["axios", "api-client",...</text>

    <rect x="0" y="60" width="120" height="30" fill="none" stroke="#A351D4" stroke-width="2"/>
    <text x="60" y="80" text-anchor="middle" fill="#A351D4" font-size="9">["axios", "weather-app",...</text>

    <!-- Value column -->
    <rect x="120" y="0" width="30" height="30" fill="none" stroke="#A351D4" stroke-width="1"/>
    <text x="135" y="20" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">1</text>
    <rect x="120" y="30" width="30" height="30" fill="none" stroke="#A351D4" stroke-width="1"/>
    <text x="135" y="50" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">1</text>
    <rect x="120" y="60" width="30" height="30" fill="none" stroke="#A351D4" stroke-width="1"/>
    <text x="135" y="80" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">1</text>
  </g>

  <!-- Second leaf -->
  <g transform="translate(250,200)">
    <rect x="0" y="0" width="120" height="30" fill="none" stroke="#A351D4" stroke-width="2"/>
    <text x="60" y="20" text-anchor="middle" fill="#A351D4" font-size="9">["express", "blog-api",...</text>

    <rect x="0" y="30" width="120" height="30" fill="none" stroke="#A351D4" stroke-width="2"/>
    <text x="60" y="50" text-anchor="middle" fill="#A351D4" font-size="9">["express", "chat-server",...</text>

    <rect x="0" y="60" width="120" height="30" fill="none" stroke="#A351D4" stroke-width="2"/>
    <text x="60" y="80" text-anchor="middle" fill="#A351D4" font-size="9">["express", "shop-backend",...</text>

    <!-- Value column -->
    <rect x="120" y="0" width="30" height="30" fill="none" stroke="#A351D4" stroke-width="1"/>
    <text x="135" y="20" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">1</text>
    <rect x="120" y="30" width="30" height="30" fill="none" stroke="#A351D4" stroke-width="1"/>
    <text x="135" y="50" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">1</text>
    <rect x="120" y="60" width="30" height="30" fill="none" stroke="#A351D4" stroke-width="1"/>
    <text x="135" y="80" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">1</text>
  </g>

  <!-- Third leaf -->
  <g transform="translate(450,200)">
    <rect x="0" y="0" width="120" height="30" fill="none" stroke="#A351D4" stroke-width="2"/>
    <text x="60" y="20" text-anchor="middle" fill="#A351D4" font-size="9">["lodash", "data-tools",...</text>

    <rect x="0" y="30" width="120" height="30" fill="none" stroke="#A351D4" stroke-width="2"/>
    <text x="60" y="50" text-anchor="middle" fill="#A351D4" font-size="9">["lodash", "parser-lib",...</text>

    <rect x="0" y="60" width="120" height="30" fill="none" stroke="#A351D4" stroke-width="2"/>
    <text x="60" y="80" text-anchor="middle" fill="#A351D4" font-size="9">["lodash", "validator",...</text>

    <!-- Value column -->
    <rect x="120" y="0" width="30" height="30" fill="none" stroke="#A351D4" stroke-width="1"/>
    <text x="135" y="20" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">1</text>
    <rect x="120" y="30" width="30" height="30" fill="none" stroke="#A351D4" stroke-width="1"/>
    <text x="135" y="50" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">1</text>
    <rect x="120" y="60" width="30" height="30" fill="none" stroke="#A351D4" stroke-width="1"/>
    <text x="135" y="80" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">1</text>
  </g>

  <!-- Fourth leaf -->
  <g transform="translate(650,200)">
    <rect x="0" y="0" width="120" height="30" fill="none" stroke="#A351D4" stroke-width="2"/>
    <text x="60" y="20" text-anchor="middle" fill="#A351D4" font-size="9">["react", "admin-ui",...</text>

    <rect x="0" y="30" width="120" height="30" fill="none" stroke="#A351D4" stroke-width="2"/>
    <text x="60" y="50" text-anchor="middle" fill="#A351D4" font-size="9">["react", "dashboard",...</text>

    <rect x="0" y="60" width="120" height="30" fill="none" stroke="#A351D4" stroke-width="2"/>
    <text x="60" y="80" text-anchor="middle" fill="#A351D4" font-size="9">["vue", "spa-app",...</text>

    <!-- Value column -->
    <rect x="120" y="0" width="30" height="30" fill="none" stroke="#A351D4" stroke-width="1"/>
    <text x="135" y="20" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">1</text>
    <rect x="120" y="30" width="30" height="30" fill="none" stroke="#A351D4" stroke-width="1"/>
    <text x="135" y="50" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">1</text>
    <rect x="120" y="60" width="30" height="30" fill="none" stroke="#A351D4" stroke-width="1"/>
    <text x="135" y="80" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">1</text>
  </g>

  <!-- Connecting lines with arrows -->
  <path d="M 300 110 L 125 200" stroke="#A351D4" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowhead-purple-npm2)"/>
  <path d="M 350 110 L 325 200" stroke="#A351D4" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowhead-purple-npm2)"/>
  <path d="M 450 110 L 525 200" stroke="#A351D4" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowhead-purple-npm2)"/>
  <path d="M 550 110 L 725 200" stroke="#A351D4" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowhead-purple-npm2)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead-purple-npm2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#A351D4"/>
    </marker>
  </defs>

  <!-- Query examples -->
  <g transform="translate(50,320)">
    <text x="0" y="0" fill="#A351D4" font-size="12" font-weight="bold">Common Queries:</text>
    <text x="0" y="20" fill="#A351D4" font-size="10">1. deps("express"): startkey=["express"], endkey=["express", {}]</text>
    <text x="0" y="35" fill="#A351D4" font-size="10">2. deps("lodash"): startkey=["lodash"], endkey=["lodash", {}]</text>
    <text x="0" y="50" fill="#A351D4" font-size="10">3. allDeps(): startkey=[], endkey=[{}]</text>
  </g>

  <!-- Reduce sum visualization -->
  <g transform="translate(500,320)">
    <rect x="0" y="0" width="150" height="60" fill="none" stroke="#A351D4" stroke-width="2" rx="5"/>
    <text x="75" y="20" text-anchor="middle" fill="#A351D4" font-size="11" font-weight="bold">reduce: "_sum"</text>
    <text x="75" y="35" text-anchor="middle" fill="#A351D4" font-size="10">express: 3 dependents</text>
    <text x="75" y="50" text-anchor="middle" fill="#A351D4" font-size="10">lodash: 3 dependents</text>
  </g>

  <!-- Filter note -->
  <g transform="translate(50,400)">
    <text x="0" y="0" fill="#A351D4" font-size="9" font-style="italic">Note: Deprecated packages and npm-test-* packages are filtered out</text>
    <text x="0" y="12" fill="#A351D4" font-size="9" font-style="italic">if (!doc || doc.deprecated) return</text>
  </g>
</svg>
