<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#1FFFA5" font-size="16" font-weight="bold">B+ Tree Needing Compaction (Tombstones)</text>

  <!-- Legend -->
  <g transform="translate(600,60)">
    <rect x="0" y="0" width="20" height="20" fill="#1FFFA5" opacity="0.2" stroke="#1FFFA5" stroke-width="1"/>
