    <text x="435" y="20" text-anchor="middle" fill="#1FFFA5" font-size="14">13</text>
    <rect x="455" y="0" width="30" height="30" fill="#1FFFA5" opacity="0.2" stroke="#1FFFA5" stroke-width="2"/>
    <text x="470" y="20" text-anchor="middle" fill="#1FFFA5" font-size="14" text-decoration="line-through">14</text>
    <rect x="490" y="0" width="30" height="30" fill="none" stroke="#1FFFA5" stroke-width="2"/>
    <text x="505" y="20" text-anchor="middle" fill="#1FFFA5" font-size="14">15</text>
    <rect x="525" y="0" width="30" height="30" fill="none" stroke="#1FFFA5" stroke-width="2"/>
    <text x="540" y="20" text-anchor="middle" fill="#1FFFA5" font-size="14">16</text>
    <rect x="560" y="0" width="30" height="30" fill="#1FFFA5" opacity="0.2" stroke="#1FFFA5" stroke-width="2"/>
    <text x="575" y="20" text-anchor="middle" fill="#1FFFA5" font-size="14" text-decoration="line-through">17</text>
    <rect x="595" y="0" width="30" height="30" fill="none" stroke="#1FFFA5" stroke-width="2"/>
