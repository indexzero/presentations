    <rect x="35" y="0" width="30" height="30" fill="none" stroke="#1FFFA5" stroke-width="2"/>
    <text x="50" y="20" text-anchor="middle" fill="#1FFFA5" font-size="14">5</text>
    <rect x="70" y="0" width="30" height="30" fill="#1FFFA5" opacity="0.2" stroke="#1FFFA5" stroke-width="2"/>
