  <!-- Connecting lines -->
  <path d="M 365 100 L 150 150" stroke="#1FFFA5" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <path d="M 385 100 L 300 150" stroke="#1FFFA5" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <path d="M 400 100 L 450 150" stroke="#1FFFA5" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <path d="M 435 100 L 600 150" stroke="#1FFFA5" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>

  <!-- Disk space indicator -->
  <g transform="translate(50,230)">
    <rect x="0" y="0" width="200" height="30" fill="none" stroke="#1FFFA5" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="30" fill="#1FFFA5" opacity="0.2"/>
    <rect x="0" y="0" width="60" height="30" fill="#1FFFA5" opacity="0.5"/>
    <text x="105" y="20" text-anchor="middle" fill="#1FFFA5" font-size="12">70% wasted space</text>
  </g>
  <text x="50" y="220" fill="#1FFFA5" font-size="12" font-weight="bold">Disk Usage:</text>

  <!-- Statistics box -->
  <g transform="translate(500,250)">
    <rect x="0" y="0" width="200" height="80" fill="none" stroke="#1FFFA5" stroke-width="2"/>
    <text x="10" y="20" fill="#1FFFA5" font-size="12" font-weight="bold">File Statistics:</text>
    <text x="10" y="40" fill="#1FFFA5" font-size="11">Active docs: 8 (30%)</text>
    <text x="10" y="55" fill="#1FFFA5" font-size="11">Tombstones: 19 (70%)</text>
    <text x="10" y="70" fill="#1FFFA5" font-size="11">Needs compaction!</text>
  </g>

  <!-- Arrow pointing to problem -->
  <path d="M 300 280 L 300 340" stroke="#1FFFA5" stroke-width="2" fill="none" marker-end="url(#arrowhead-cyan-tomb)"/>
  <text x="320" y="300" fill="#1FFFA5" font-size="11" font-style="italic">Many tombstones</text>
  <text x="320" y="315" fill="#1FFFA5" font-size="11" font-style="italic">consuming space</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead-cyan-tomb" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#1FFFA5"/>
    </marker>
  </defs>
