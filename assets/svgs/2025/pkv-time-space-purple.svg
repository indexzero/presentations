<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600">
  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" fill="#A351D4" font-size="16" font-weight="bold">Time-Space Dependent Signatures (Recommended)</text>

  <!-- Time-Space Data -->
  <g transform="translate(250,70)">
    <rect x="0" y="0" width="200" height="50" rx="5" fill="#A351D4" opacity="0.1" stroke="#A351D4" stroke-width="2"/>
    <text x="100" y="20" text-anchor="middle" fill="#A351D4" font-size="11" font-weight="bold">Time-Space Data</text>
    <text x="50" y="38" text-anchor="middle" fill="#A351D4" font-size="10">🕐 2024-01-15T10:30Z</text>
    <text x="150" y="38" text-anchor="middle" fill="#A351D4" font-size="10">🌍 node-us-east-1</text>
  </g>

  <!-- Arrow down to hash -->
  <line x1="350" y1="120" x2="350" y2="140" stroke="#A351D4" stroke-width="1.5" marker-end="url(#arrowhead-cyan-ts)"/>

  <!-- Hash Time-Space -->
  <g transform="translate(300,140)">
    <rect x="0" y="0" width="100" height="30" rx="5" fill="#A351D4" opacity="0.15" stroke="#A351D4" stroke-width="2"/>
    <text x="50" y="20" text-anchor="middle" fill="#A351D4" font-size="11">H(time-space)</text>
  </g>

  <!-- Result of hash -->
  <g transform="translate(280,180)">
    <rect x="0" y="0" width="140" height="25" rx="3" fill="#A351D4" stroke="#A351D4" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="70" y="17" text-anchor="middle" fill="white" font-size="9" font-family="monospace">0x8E2D...</text>
  </g>

  <!-- PKV Data inputs -->
  <g transform="translate(100,250)">
    <text x="250" y="-10" text-anchor="middle" fill="#A351D4" font-size="10" font-weight="bold">PKV Data</text>

    <rect x="50" y="0" width="100" height="25" rx="5" fill="#A351D4" opacity="0.05" stroke="#A351D4" stroke-width="2"/>
    <text x="100" y="17" text-anchor="middle" fill="#A351D4" font-size="9" font-family="monospace">PKV-KEY</text>

    <rect x="200" y="0" width="100" height="25" rx="5" fill="#A351D4" opacity="0.05" stroke="#A351D4" stroke-width="2"/>
    <text x="250" y="17" text-anchor="middle" fill="#A351D4" font-size="9" font-family="monospace">PKV-VALUE</text>

    <rect x="350" y="0" width="100" height="25" rx="5" fill="#A351D4" opacity="0.05" stroke="#A351D4" stroke-width="2"/>
    <text x="400" y="17" text-anchor="middle" fill="#A351D4" font-size="9" font-family="monospace">PKV-KV</text>
  </g>

  <!-- Arrows converging to combine -->
  <!-- From time-space hash -->
  <line x1="350" y1="205" x2="350" y2="320" stroke="#A351D4" stroke-width="1.5"/>
  <!-- From PKV-KEY -->
  <line x1="200" y1="275" x2="200" y2="310" stroke="#A351D4" stroke-width="1.5"/>
  <line x1="200" y1="310" x2="330" y2="330" stroke="#A351D4" stroke-width="1.5"/>
  <!-- From PKV-VALUE -->
  <line x1="350" y1="275" x2="350" y2="320" stroke="#A351D4" stroke-width="1.5"/>
  <!-- From PKV-KV -->
  <line x1="500" y1="275" x2="500" y2="310" stroke="#A351D4" stroke-width="1.5"/>
  <line x1="500" y1="310" x2="370" y2="330" stroke="#A351D4" stroke-width="1.5"/>

  <!-- Combine operation -->
  <g transform="translate(300,330)">
    <path d="M 0 0 L 100 0 L 50 30 Z" fill="#A351D4" opacity="0.2" stroke="#A351D4" stroke-width="2"/>
    <text x="50" y="20" text-anchor="middle" fill="#A351D4" font-size="11">Combine</text>
  </g>

  <!-- Arrow down to sign -->
  <line x1="350" y1="360" x2="350" y2="380" stroke="#A351D4" stroke-width="1.5" marker-end="url(#arrowhead-cyan-ts)"/>

  <!-- Sign operation -->
  <g transform="translate(280,380)">
    <rect x="20" y="0" width="120" height="30" rx="5" fill="#A351D4" opacity="0.2" stroke="#A351D4" stroke-width="2"/>
    <text x="40" y="20" fill="#A351D4" font-size="11">🔒</text>
    <text x="80" y="20" text-anchor="middle" fill="#A351D4" font-size="10">Sign with key</text>
  </g>

  <!-- Arrow to final signature -->
  <line x1="400" y1="395" x2="430" y2="395" stroke="#A351D4" stroke-width="1.5" marker-end="url(#arrowhead-cyan-ts)"/>

  <!-- Final Signature -->
  <g transform="translate(430,380)">
    <rect x="0" y="0" width="200" height="30" rx="5" fill="#A351D4" opacity="0.25" stroke="#A351D4" stroke-width="3"/>
    <text x="100" y="20" text-anchor="middle" fill="#A351D4" font-size="10" font-family="monospace">Sig(H(ts)+PKV)</text>
  </g>

  <!-- Benefits box -->
  <g transform="translate(100,460)">
    <rect x="0" y="0" width="500" height="80" rx="5" fill="#A351D4" opacity="0.05" stroke="#A351D4" stroke-width="2"/>
    <text x="20" y="25" fill="#A351D4" font-size="12">✅</text>
    <text x="40" y="25" fill="#A351D4" font-size="11" font-weight="bold">Benefits of Time-Space Signatures:</text>
    <text x="40" y="45" fill="#A351D4" font-size="10">• Replay attack protection - signatures bound to specific time</text>
    <text x="40" y="60" fill="#A351D4" font-size="10">• Audit trail - know when and where data was signed</text>
    <text x="40" y="75" fill="#A351D4" font-size="10">• Network consensus - nodes can verify temporal ordering</text>
  </g>

  <!-- Recommended badge -->
  <g transform="translate(520,70)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#A351D4" opacity="0.2" stroke="#A351D4" stroke-width="2"/>
    <text x="10" y="20" fill="#A351D4" font-size="12">⭐</text>
    <text x="30" y="20" fill="#A351D4" font-size="11" font-weight="bold">RECOMMENDED</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead-cyan-ts" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#A351D4"/>
    </marker>
  </defs>
</svg>