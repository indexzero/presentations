<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 650">
  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" fill="#F2E55C" font-size="16" font-weight="bold">PKV Recursive Hashing Algorithm</text>

  <!-- Input array -->
  <g transform="translate(200,70)">
    <text x="150" y="-5" text-anchor="middle" fill="#F2E55C" font-size="11" font-weight="bold">Input: [A, B, C]</text>
    <rect x="0" y="0" width="100" height="30" rx="5" fill="none" stroke="#F2E55C" stroke-width="2"/>
    <text x="50" y="20" text-anchor="middle" fill="#F2E55C" font-size="12">A</text>

    <rect x="100" y="0" width="100" height="30" rx="5" fill="none" stroke="#F2E55C" stroke-width="2"/>
    <text x="150" y="20" text-anchor="middle" fill="#F2E55C" font-size="12">B</text>

    <rect x="200" y="0" width="100" height="30" rx="5" fill="none" stroke="#F2E55C" stroke-width="2"/>
    <text x="250" y="20" text-anchor="middle" fill="#F2E55C" font-size="12">C</text>
  </g>

  <!-- Step 1: Double hash first element -->
  <g transform="translate(100,140)">
    <rect x="0" y="0" width="500" height="80" rx="5" fill="none" stroke="#F2E55C" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="10" y="20" fill="#F2E55C" font-size="11" font-weight="bold">Step 1: Double-hash first element</text>

    <text x="20" y="40" fill="#F2E55C" font-size="10" font-family="monospace">h₁ = H(A)</text>
    <text x="250" y="40" fill="#F2E55C" font-size="9">// First hash of A</text>

    <text x="20" y="60" fill="#F2E55C" font-size="10" font-family="monospace">result = H(h₁)</text>
    <text x="250" y="60" fill="#F2E55C" font-size="9">// Second hash (double-hash)</text>

    <rect x="350" y="35" width="130" height="30" rx="5" fill="#F2E55C" opacity="0.1" stroke="#F2E55C" stroke-width="2"/>
    <text x="415" y="55" text-anchor="middle" fill="#F2E55C" font-size="9" font-family="monospace">result: 0xA3F2...</text>
  </g>

  <!-- Step 2: Process second element -->
  <g transform="translate(100,250)">
    <rect x="0" y="0" width="500" height="80" rx="5" fill="none" stroke="#F2E55C" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="10" y="20" fill="#F2E55C" font-size="11" font-weight="bold">Step 2: Combine with second element</text>

    <text x="20" y="40" fill="#F2E55C" font-size="10" font-family="monospace">h₂ = H(B)</text>
    <text x="250" y="40" fill="#F2E55C" font-size="9">// Hash of B</text>

    <text x="20" y="60" fill="#F2E55C" font-size="10" font-family="monospace">result = H(result || h₂)</text>
    <text x="250" y="60" fill="#F2E55C" font-size="9">// Concatenate then hash</text>

    <rect x="350" y="35" width="130" height="30" rx="5" fill="#F2E55C" opacity="0.15" stroke="#F2E55C" stroke-width="2"/>
    <text x="415" y="55" text-anchor="middle" fill="#F2E55C" font-size="9" font-family="monospace">result: 0xB7E9...</text>
  </g>

  <!-- Step 3: Process third element -->
  <g transform="translate(100,360)">
    <rect x="0" y="0" width="500" height="80" rx="5" fill="none" stroke="#F2E55C" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="10" y="20" fill="#F2E55C" font-size="11" font-weight="bold">Step 3: Combine with third element</text>

    <text x="20" y="40" fill="#F2E55C" font-size="10" font-family="monospace">h₃ = H(C)</text>
    <text x="250" y="40" fill="#F2E55C" font-size="9">// Hash of C</text>

    <text x="20" y="60" fill="#F2E55C" font-size="10" font-family="monospace">result = H(result || h₃)</text>
    <text x="250" y="60" fill="#F2E55C" font-size="9">// Concatenate then hash</text>

    <rect x="350" y="35" width="130" height="30" rx="5" fill="#F2E55C" opacity="0.2" stroke="#F2E55C" stroke-width="2"/>
    <text x="415" y="55" text-anchor="middle" fill="#F2E55C" font-size="9" font-family="monospace">result: 0xC4D2...</text>
  </g>

  <!-- Mathematical notation -->
  <g transform="translate(100,470)">
    <rect x="0" y="0" width="500" height="60" rx="5" fill="#F2E55C" opacity="0.05" stroke="#F2E55C" stroke-width="2"/>
    <text x="250" y="20" text-anchor="middle" fill="#F2E55C" font-size="11" font-weight="bold">Mathematical Formula:</text>
    <text x="250" y="40" text-anchor="middle" fill="#F2E55C" font-size="10" font-family="monospace">PKV-KEY = H(H(H(A)) || H(B)) || H(C))</text>
    <text x="250" y="55" text-anchor="middle" fill="#F2E55C" font-size="9">Where || denotes binary concatenation</text>
  </g>

  <!-- Key properties -->
  <g transform="translate(100,550)">
    <rect x="0" y="0" width="500" height="70" rx="5" fill="none" stroke="#F2E55C" stroke-width="2"/>
    <text x="250" y="20" text-anchor="middle" fill="#F2E55C" font-size="11" font-weight="bold">Properties:</text>
    <text x="20" y="40" fill="#F2E55C" font-size="10">• Deterministic: Same input always produces same output</text>
    <text x="20" y="55" fill="#F2E55C" font-size="10">• Order-dependent: [A,B,C] ≠ [C,B,A]</text>
    <text x="260" y="40" fill="#F2E55C" font-size="10">• Irreversible: Cannot recover input from output</text>
    <text x="260" y="55" fill="#F2E55C" font-size="10">• Collision-resistant: Hard to find duplicates</text>
  </g>
</svg>