<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#F2E55C" font-size="16" font-weight="bold">PKV Network Architecture - "Of The Web"</text>

  <!-- Central existing data/resource -->
  <g transform="translate(350,250)">
    <rect x="0" y="0" width="100" height="100" rx="10" fill="#F2E55C" opacity="0.1" stroke="#F2E55C" stroke-width="3"/>
    <text x="50" y="45" text-anchor="middle" fill="#F2E55C" font-size="11" font-weight="bold">Existing</text>
    <text x="50" y="60" text-anchor="middle" fill="#F2E55C" font-size="11" font-weight="bold">Data</text>
    <text x="50" y="80" text-anchor="middle" fill="#F2E55C" font-size="9">(Any source)</text>
  </g>

  <!-- Party A (top-left) -->
  <g transform="translate(150,100)">
    <circle cx="40" cy="40" r="35" fill="#F2E55C" opacity="0.05" stroke="#F2E55C" stroke-width="2"/>
    <text x="40" y="35" text-anchor="middle" fill="#F2E55C" font-size="10" font-weight="bold">Party A</text>
    <text x="40" y="50" text-anchor="middle" fill="#F2E55C" font-size="9">Research</text>

    <path d="M 70 70 L 350 250" stroke="#F2E55C" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead-cyan-net)"/>

    <rect x="100" y="60" width="120" height="50" rx="5" fill="none" stroke="#F2E55C" stroke-width="1"/>
    <text x="160" y="78" text-anchor="middle" fill="#F2E55C" font-size="9" font-weight="bold">PKV Description</text>
    <text x="160" y="92" text-anchor="middle" fill="#F2E55C" font-size="8" font-family="monospace">["data","metadata",</text>
    <text x="160" y="104" text-anchor="middle" fill="#F2E55C" font-size="8" font-family="monospace">"author"]</text>
  </g>

  <!-- Party B (top-right) -->
  <g transform="translate(550,100)">
    <circle cx="40" cy="40" r="35" fill="#F2E55C" opacity="0.05" stroke="#F2E55C" stroke-width="2"/>
    <text x="40" y="35" text-anchor="middle" fill="#F2E55C" font-size="10" font-weight="bold">Party B</text>
    <text x="40" y="50" text-anchor="middle" fill="#F2E55C" font-size="9">Commerce</text>

    <path d="M 10 70 L 450 250" stroke="#F2E55C" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead-cyan-net)"/>

    <rect x="-40" y="60" width="120" height="50" rx="5" fill="none" stroke="#F2E55C" stroke-width="1"/>
    <text x="20" y="78" text-anchor="middle" fill="#F2E55C" font-size="9" font-weight="bold">PKV Description</text>
    <text x="20" y="92" text-anchor="middle" fill="#F2E55C" font-size="8" font-family="monospace">["data","price",</text>
    <text x="20" y="104" text-anchor="middle" fill="#F2E55C" font-size="8" font-family="monospace">"license"]</text>
  </g>

  <!-- Party C (bottom-left) - Forking -->
  <g transform="translate(150,400)">
    <circle cx="40" cy="40" r="35" fill="#F2E55C" opacity="0.05" stroke="#F2E55C" stroke-width="2"/>
    <text x="40" y="35" text-anchor="middle" fill="#F2E55C" font-size="10" font-weight="bold">Party C</text>
    <text x="40" y="50" text-anchor="middle" fill="#F2E55C" font-size="9">Fork of A</text>

    <path d="M 70 10 L 350 300" stroke="#F2E55C" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead-cyan-net)"/>

    <!-- Fork indicator -->
    <path d="M 40 -10 L 40 -40 L 190 -240" stroke="#F2E55C" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="100" y="-50" fill="#F2E55C" font-size="9" font-style="italic">Cryptographic fork</text>
  </g>

  <!-- Party D (bottom-right) -->
  <g transform="translate(550,400)">
    <circle cx="40" cy="40" r="35" fill="#F2E55C" opacity="0.05" stroke="#F2E55C" stroke-width="2"/>
    <text x="40" y="35" text-anchor="middle" fill="#F2E55C" font-size="10" font-weight="bold">Party D</text>
    <text x="40" y="50" text-anchor="middle" fill="#F2E55C" font-size="9">Archive</text>

    <path d="M 10 10 L 450 300" stroke="#F2E55C" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead-cyan-net)"/>
  </g>

  <!-- Protocol compatibility -->
  <g transform="translate(50,500)">
    <rect x="0" y="0" width="300" height="60" rx="5" fill="none" stroke="#F2E55C" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="150" y="20" text-anchor="middle" fill="#F2E55C" font-size="11" font-weight="bold">Compatible Protocols:</text>
    <text x="50" y="40" text-anchor="middle" fill="#F2E55C" font-size="10">HTTP/S</text>
    <text x="100" y="40" text-anchor="middle" fill="#F2E55C" font-size="10">IPFS</text>
    <text x="150" y="40" text-anchor="middle" fill="#F2E55C" font-size="10">BitTorrent</text>
    <text x="210" y="40" text-anchor="middle" fill="#F2E55C" font-size="10">WebRTC</text>
    <text x="270" y="40" text-anchor="middle" fill="#F2E55C" font-size="10">Any</text>
  </g>

  <!-- Key principles -->
  <g transform="translate(450,500)">
    <rect x="0" y="0" width="300" height="60" rx="5" fill="#F2E55C" opacity="0.05" stroke="#F2E55C" stroke-width="2"/>
    <text x="150" y="20" text-anchor="middle" fill="#F2E55C" font-size="11" font-weight="bold">Key Principles:</text>
    <text x="30" y="40" fill="#F2E55C" font-size="9">• Permissionless description</text>
    <text x="30" y="53" fill="#F2E55C" font-size="9">• Consensus-driven • No central authority</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead-cyan-net" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#F2E55C"/>
    </marker>
  </defs>
</svg>